aid: oak
name: Oak
description: >-
  Oak is an AI-native identity operating system that governs human, machine, and
  AI-agent identities from a single platform. Its Identity Intelligence Layer
  unifies identity data into a graph that serves as a foundational security
  layer, paired with Agentic Identity governance for AI agents, a Connect Any
  connector layer spanning on-premises, SaaS, cloud, and custom systems, and
  White Glove enterprise onboarding services. Oak is an early-stage,
  enterprise/sales-led identity-security company backed by CRV; it currently
  exposes a customer login app but no public API, developer portal, or
  documentation.
